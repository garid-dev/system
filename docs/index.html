<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Онлайн дэлгүүр — GitHub Pages</title>
    <link rel="stylesheet" href="assets/style.css?v=5" />
</head>
<body>
    <div class="hero">
        <h1>🛒 Онлайн дэлгүүр</h1>
        <p>Бараа сонгож, сагсанд нэмээд захиалга өгөх боломжтой.</p>
    </div>

    <div class="wrap">
        <div id="msg" class="msg hidden"></div>

        <div class="grid">
            <section class="card">
                <h2 id="userTitle">🔑 Нэвтрэх / Бүртгүүлэх</h2>
                <div id="loginBox">
                    <label>Нэвтрэх нэр</label>
                    <input id="loginUser" value="bold" autocomplete="username" />
                    <label>Нууц үг</label>
                    <input id="loginPass" type="password" value="bold123" autocomplete="current-password" />
                    <button onclick="doLogin()">Нэвтрэх</button>
                </div>
                <div id="userBox" class="hidden">
                    <p>Сайн байна уу, <b id="userNameText"></b> (<span id="userRoleText" class="code"></span>)</p>
                    <button class="danger" onclick="doLogout()">Гарах</button>
                </div>
                <hr />
                <h3>Шинэ хэрэглэгч бүртгүүлэх</h3>
                <label>Нэвтрэх нэр</label>
                <input id="regUser" />
                <label>Нууц үг</label>
                <input id="regPass" type="password" />
                <label>Овог нэр</label>
                <input id="regName" />
                <label>Имэйл</label>
                <input id="regEmail" type="email" />
                <button onclick="doRegister()">Бүртгүүлэх</button>
                <p class="hint">Туршилт: bold / bold123 эсвэл admin / admin123</p>
            </section>

            <section class="card">
                <h2>📦 Бараанууд <span id="productCount" class="code"></span></h2>
                <table>
                    <thead>
                        <tr><th>Код</th><th>Нэр</th><th>Ангилал</th><th class="money">Үнэ ₮</th><th>Үлдэгдэл</th><th></th></tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </section>
        </div>

        <section class="card">
            <h2>🧺 Сагс</h2>
            <div id="cartArea"></div>
        </section>

    </div>

    <script src="assets/products-fallback.js?v=5"></script>
    <script src="assets/config.js?v=5"></script>
    <script src="assets/app.js?v=5"></script>
</body>
</html>
